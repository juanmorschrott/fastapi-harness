name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --python "${{ matrix.python }}"
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check src tests
      - run: uv run --locked lint-imports
      - run: uv run --locked xenon --max-absolute B --max-modules A --max-average A src/fastapi_harness
